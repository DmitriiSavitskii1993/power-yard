<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#161616}</style></head><body>
<!-- Обложка 640×360 для Mini App: логотип + подпись, фирменный чёрный/красный.
     Открыть в браузере и заскриншотить в img/cover.png. -->
<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="640" height="360" fill="#161616"/>
  <!-- красная фирменная полоса снизу -->
  <rect x="0" y="352" width="640" height="8" fill="#CD003E"/>
  <!-- логотип слева -->
  <image href="logo.png" x="44" y="96" width="248" height="190" preserveAspectRatio="xMidYMid meet"/>
  <!-- текст справа -->
  <g font-family="'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="452" y="158" font-size="30" font-weight="800">Калькулятор авто</text>
    <text x="452" y="192" font-size="17" font-weight="500" fill="#9a9a9a">под ключ из-за рубежа</text>
    <text x="452" y="242" font-size="22" font-weight="600">🇰🇷 Корея · 🇪🇺 Европа</text>
  </g>
</svg>
</body></html>
