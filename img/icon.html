<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#161616}</style></head><body>
<!-- Иконка приложения 512×512: логотип Power Yard на фирменном чёрном фоне.
     Открыть в браузере и заскриншотить область svg в img/icon.png. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#161616"/>
  <!-- тонкая красная фирменная рамка -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#CD003E" stroke-width="6" opacity="0.9"/>
  <!-- логотип по центру (лого на чёрном сольётся с фоном) -->
  <image href="logo.png" x="86" y="140" width="340" height="262" preserveAspectRatio="xMidYMid meet"/>
</svg>
</body></html>
